<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f5f5f5;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      h1 {
        margin-bottom: 20px;
        color: #333;
      }

      .btn-container {
        margin-bottom: 20px;
      }

      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        font-size: 14px;
        margin-right: 10px;
      }

      .btn-primary {
        background: #007bff;
        color: white;
      }

      .btn-success {
        background: #28a745;
        color: white;
      }

      .btn-danger {
        background: #dc3545;
        color: white;
      }

      .btn-secondary {
        background: #6c757d;
        color: white;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }

      th {
        background: #f8f9fa;
        font-weight: bold;
      }

      tr:hover {
        background: #f8f9fa;
      }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
      }

      .modal-content {
        background: white;
        max-width: 500px;
        margin: 50px auto;
        border-radius: 5px;
        padding: 20px;
      }

      .modal-header {
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .close {
        font-size: 24px;
        cursor: pointer;
        color: #666;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      .form-group input,
      .form-group select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 3px;
      }

      .form-actions {
        margin-top: 20px;
        text-align: right;
      }

      .badge {
        padding: 3px 8px;
        border-radius: 3px;
        font-size: 12px;
        font-weight: bold;
      }

      .badge-admin {
        background: #ffc107;
        color: #000;
      }

      .badge-user {
        background: #17a2b8;
        color: white;
      }

      .loading {
        text-align: center;
        padding: 20px;
      }

      .error {
        color: #dc3545;
        padding: 10px;
        background: #f8d7da;
        border-radius: 3px;
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>User Management</h1>

      <div class="btn-container">
        <button class="btn btn-primary" onclick="openCreateModal()">
          Add New User
        </button>
        <button class="btn btn-secondary" onclick="loadUsers()">Refresh</button>
      </div>

      <div id="loading" class="loading" style="display: none">
        Loading users...
      </div>
      <div id="error" class="error" style="display: none"></div>
      <div id="tableContainer"></div>
    </div>

    <!-- Create/Edit Modal -->
    <div id="userModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Add New User</h2>
          <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <form id="userForm">
          <input type="hidden" id="userId" />
          <div class="form-group">
            <label for="username">Username *</label>
            <input type="text" id="username" required />
          </div>
          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" required />
          </div>
          <div class="form-group">
            <label for="password"
              >Password <span id="passwordOptional"></span
            ></label>
            <input type="password" id="password" />
          </div>
          <div class="form-group">
            <label for="role">Role *</label>
            <select id="role" required>
              <option value="user">User</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="form-actions">
            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeModal()"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const API_URL =
        "http://localhost/Health_AI/Backend/Controllers/UserController.php";
      let isEditMode = false;

      function getUser() {
        const user = localStorage.getItem("user");
        return user ? JSON.parse(user) : null;
      }

      // Check if user is admin
      function checkAdmin() {
        const user = getUser();
        if (!user || user.role !== "admin") {
          showError("Access denied. Admin privileges required.");
          return false;
        }
        return true;
      }

      // Load users on page load
      document.addEventListener("DOMContentLoaded", () => {
        if (checkAdmin()) {
          loadUsers();
        }
      });

      // Show error message
      function showError(message) {
        const errorDiv = document.getElementById("error");
        errorDiv.textContent = message;
        errorDiv.style.display = "block";
      }

      // Load all users
      async function loadUsers() {
        if (!checkAdmin()) return;

        const user = getUser();
        const loading = document.getElementById("loading");
        const tableContainer = document.getElementById("tableContainer");

        loading.style.display = "block";
        tableContainer.innerHTML = "";

        try {
          const response = await fetch(`${API_URL}?user_id=${user.id}`);
          const data = await response.json();

          loading.style.display = "none";

          if (data.status === 200 && Array.isArray(data.data)) {
            renderTable(data.data);
          } else {
            showError(data.message || "Failed to load users");
          }
        } catch (error) {
          loading.style.display = "none";
          showError("Error loading users: " + error.message);
        }
      }

      // Render users table
      function renderTable(users) {
        const tableContainer = document.getElementById("tableContainer");

        if (users.length === 0) {
          tableContainer.innerHTML = "<p>No users found</p>";
          return;
        }

        let html = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Created At</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

        users.forEach((u) => {
          const roleClass = u.role === "admin" ? "badge-admin" : "badge-user";
          html += `
                    <tr>
                        <td>${u.id}</td>
                        <td>${u.username}</td>
                        <td>${u.email}</td>
                        <td><span class="badge ${roleClass}">${
            u.role
          }</span></td>
                        <td>${new Date(u.created_at).toLocaleString()}</td>
                        <td>
                            <button class="btn btn-success" onclick='openEditModal(${JSON.stringify(
                              u
                            )})'>Edit</button>
                            <button class="btn btn-danger" onclick="deleteUser(${
                              u.id
                            }, '${u.username}')">Delete</button>
                        </td>
                    </tr>
                `;
        });

        html += `</tbody></table>`;
        tableContainer.innerHTML = html;
      }

      // Open create modal
      function openCreateModal() {
        if (!checkAdmin()) return;

        isEditMode = false;
        document.getElementById("modalTitle").textContent = "Add New User";
        document.getElementById("userForm").reset();
        document.getElementById("userId").value = "";
        document.getElementById("password").required = true;
        document.getElementById("passwordOptional").textContent = "";
        document.getElementById("userModal").style.display = "block";
      }

      // Open edit modal
      function openEditModal(userData) {
        if (!checkAdmin()) return;

        isEditMode = true;
        document.getElementById("modalTitle").textContent = "Edit User";
        document.getElementById("userId").value = userData.id;
        document.getElementById("username").value = userData.username;
        document.getElementById("email").value = userData.email;
        document.getElementById("role").value = userData.role;
        document.getElementById("password").value = "";
        document.getElementById("password").required = false;
        document.getElementById("passwordOptional").textContent =
          "(leave blank to keep current)";
        document.getElementById("userModal").style.display = "block";
      }

      // Close modal
      function closeModal() {
        document.getElementById("userModal").style.display = "none";
        document.getElementById("userForm").reset();
      }

      // Handle form submission
      document
        .getElementById("userForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          if (!checkAdmin()) return;

          const user = getUser();
          const userId = document.getElementById("userId").value;
          const username = document.getElementById("username").value;
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const role = document.getElementById("role").value;

          const payload = { username, email, role };
          if (password) {
            payload.password = password;
          }

          try {
            let response;
            if (isEditMode && userId) {
              response = await fetch(
                `${API_URL}?user_id=${user.id}&id=${userId}`,
                {
                  method: "PATCH",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(payload),
                }
              );
            } else {
              response = await fetch(`${API_URL}?user_id=${user.id}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
              });
            }

            const data = await response.json();

            if (data.status === 200 || data.status === 201) {
              alert(data.message);
              closeModal();
              loadUsers();
            } else {
              showError(data.message);
            }
          } catch (error) {
            showError("Error: " + error.message);
          }
        });

      // Delete user
      async function deleteUser(id, username) {
        if (!checkAdmin()) return;

        if (!confirm(`Are you sure you want to delete user "${username}"?`)) {
          return;
        }

        const user = getUser();

        try {
          const response = await fetch(
            `${API_URL}?user_id=${user.id}&id=${id}`,
            {
              method: "DELETE",
            }
          );

          const data = await response.json();

          if (data.status === 200) {
            alert(data.message);
            loadUsers();
          } else {
            showError(data.message);
          }
        } catch (error) {
          showError("Error: " + error.message);
        }
      }

      // Close modal when clicking outside
      window.onclick = function (event) {
        const modal = document.getElementById("userModal");
        if (event.target === modal) {
          closeModal();
        }
      };
    </script>
  </body>
</html>
