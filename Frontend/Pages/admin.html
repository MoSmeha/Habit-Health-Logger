<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management</title>
    <link rel="stylesheet" href="../styles/admin.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-left">
        <a class="logo" href="dashboard.html"><span>Health AI</span></a>
      </div>

      <div class="nav-right" id="navbarLinks">
        <a href="entries.html">Entries</a>
        <a href="habits.html">Habits</a>
        <a href="Login.html">Nutrition</a>
        <a href="#">later</a>
      </div>
    </nav>
    <div class="container">
      <h1>User Management</h1>

      <div class="btn-container">
        <button class="btn btn-primary" onclick="openCreateModal()">
          Add New User
        </button>
        <button class="btn btn-secondary" onclick="loadUsers()">Refresh</button>
      </div>

      <div id="loading" class="loading" style="display: none">
        Loading users...
      </div>
      <div id="error" class="error" style="display: none"></div>
      <div id="tableContainer"></div>
    </div>

    <div id="userModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Add New User</h2>
          <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <form id="userForm">
          <input type="hidden" id="userId" />
          <div class="form-group">
            <label for="username">Username *</label>
            <input type="text" id="username" required />
          </div>
          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" required />
          </div>
          <div class="form-group">
            <label for="password"
              >Password <span id="passwordOptional"></span
            ></label>
            <input type="password" id="password" />
          </div>
          <div class="form-group">
            <label for="role">Role *</label>
            <select id="role" required>
              <option value="user">User</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="form-actions">
            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeModal()"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <script src="../Scripts//admin.js"></script>
  </body>
</html>
