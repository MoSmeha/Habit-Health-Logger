<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habits & AI Analysis</title>
    <style>
      /* --- Global Styles --- */
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f7f9fc;
        margin: 0;
        padding: 0;
        color: #333;
        line-height: 1.6;
      }

      a {
        text-decoration: none;
        color: #333;
      }

      a:hover {
        text-decoration: underline;
      }

      /* --- Navbar --- */
      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #4caf50;
        padding: 15px 20px;
        color: white;
      }

      .nav-left .logo {
        font-size: 1.2em;
        font-weight: bold;
        color: white;
      }

      .nav-right a {
        margin-left: 20px;
        color: white;
        font-size: 14px;
      }

      .nav-right a.active {
        font-weight: bold;
        text-decoration: underline;
      }

      /* --- Containers --- */
      .container {
        margin: 5%;
        padding: 0 20px;
        background-color: #fff;
        border-radius: 10px;
        padding: 2em;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 24px;
        color: #333;
        border-bottom: 1px solid #ddd;
        padding-bottom: 10px;
      }

      h2 {
        margin: 30px 0 15px;
        font-size: 18px;
        color: #333;
        border-bottom: 1px solid #eee;
        padding-bottom: 5px;
      }

      #userInfo {
        margin-bottom: 20px;
        color: #666;
        font-size: 14px;
      }

      /* --- Forms & Buttons --- */
      form {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
      }

      input[type="text"] {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        font-size: 15px;
        border-radius: 4px; /* Added border-radius */
      }

      button {
        padding: 10px 20px;
        border: none;
        cursor: pointer;
        font-size: 14px;
        background: #4caf50;
        color: white;
        border-radius: 4px; /* Added border-radius */
      }

      button:hover {
        background: #45a049;
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      /* Minimal delete button style */
      button.danger {
        background: #e74c3c;
      }

      button.danger:hover {
        background: #c0392b;
      }

      .habit-actions button {
        margin-left: 5px;
        padding: 5px 10px;
        font-size: 12px;
      }

      .analyze-btn {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        background: #4caf50;
        font-weight: bold;
      }

      /* --- Habit Lists --- */
      .habit {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid #eee;
      }

      .habit-name {
        font-weight: bold;
        font-size: 16px;
      }

      /* --- Analysis Results Area --- */
      .loading {
        text-align: center;
        padding: 20px;
        color: #666;
        font-style: italic;
      }

      /* --- AI Response Clean Layout --- */
      .summary,
      .tips,
      .habits-section {
        margin-bottom: 25px;
        padding: 15px;
        border: 1px solid #ddd;
      }

      .summary h3,
      .tips h3,
      .habits-section h3 {
        margin-top: 0;
        font-size: 16px;
        color: #4caf50;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* Needs attention section in red */
      .habits-section.needs-attention {
        border-color: #e74c3c;
      }
      .habits-section.needs-attention h3 {
        color: #e74c3c;
      }

      .habit-item {
        margin-bottom: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid #f5f5f5;
      }

      .habit-item:last-child {
        border-bottom: none;
      }

      .habit-item .habit-title {
        font-weight: bold;
        display: block;
        color: #333;
      }

      .habit-item span {
        color: #555;
        font-size: 14px;
      }

      .tips ul {
        padding-left: 20px;
        margin: 0;
      }

      .tips li {
        margin-bottom: 5px;
      }

      .error {
        border: 1px solid #e74c3c;
        color: #e74c3c;
        padding: 15px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-left">
        <a class="logo" href="dashboard.html"><span>Health AI</span></a>
      </div>
      <div class="nav-right" id="navbarLinks">
        <a href="entries.html">Entries</a>
        <a class="active" href="habits.html">Habits</a>
        <a href="Nutrition.html">Nutrition</a>
      </div>
    </nav>

    <div class="container">
      <h1>Manage Habits</h1>
      <div id="userInfo">Checking login...</div>

      <form id="createForm">
        <input
          type="text"
          id="nameInput"
          placeholder="Enter habit name..."
          required
        />
        <button type="submit">Add Habit</button>
      </form>

      <div id="habitList"></div>
    </div>

    <div class="container">
      <h1>AI Coach Analysis</h1>
      <p style="color: #666; margin-bottom: 15px">
        Review your weekly logs against active habits.
      </p>
      <button id="analyzeBtn" class="analyze-btn">Analyze My Week</button>
      <div id="results" style="margin-top: 25px"></div>
    </div>

    <script>
      // CONFIGURATION
      const API_BASE = "http://localhost/Health_AI/Backend/Controllers";

      // --- Auth & User Helpers ---
      function getUser() {
        const user = localStorage.getItem("user");
        return user ? JSON.parse(user) : null;
      }

      function renderUser() {
        const user = getUser();
        const infoDiv = document.getElementById("userInfo");

        if (user) {
          infoDiv.innerHTML = `Logged in as: <strong>${user.username}</strong>`;
          renderAdminLink(user);
        } else {
          infoDiv.innerHTML = `Not logged in. <a href="Login.html" style="color: #4caf50; text-decoration: underline;">Login here</a>`;
          document.getElementById("analyzeBtn").disabled = true;
          document.querySelector("form button").disabled = true;
        }
      }

      function renderAdminLink(user) {
        const navbar = document.getElementById("navbarLinks");
        if (
          user.role === "admin" &&
          navbar &&
          !document.getElementById("adminLink")
        ) {
          const link = document.createElement("a");
          link.href = "admin.html";
          link.id = "adminLink";
          link.innerText = "Admin";
          navbar.appendChild(link);
        }
      }

      // --- Habit CRUD Operations ---
      async function loadHabits() {
        const user = getUser();
        if (!user) return;

        try {
          const response = await fetch(
            `${API_BASE}/HabitController.php?user_id=${user.id}`
          );
          const json = await response.json();

          if (json.data) {
            renderHabitList(json.data);
          }
        } catch (error) {
          console.error("Failed to load habits:", error);
        }
      }

      async function createHabit(name) {
        const user = getUser();
        try {
          await fetch(`${API_BASE}/HabitController.php?user_id=${user.id}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name }),
          });
          loadHabits();
        } catch (e) {
          console.error(e);
        }
      }

      async function toggleHabit(id, currentStatus) {
        const user = getUser();
        const newStatus = currentStatus == 1 ? 0 : 1;

        try {
          await fetch(
            `${API_BASE}/HabitController.php?user_id=${user.id}&id=${id}`,
            {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ active: newStatus }),
            }
          );
          loadHabits();
        } catch (e) {
          console.error(e);
        }
      }

      async function deleteHabit(id) {
        if (!confirm("Delete this habit?")) return;

        const user = getUser();
        try {
          await fetch(
            `${API_BASE}/HabitController.php?user_id=${user.id}&id=${id}`,
            {
              method: "DELETE",
            }
          );
          loadHabits();
        } catch (e) {
          console.error(e);
        }
      }

      function renderHabitList(habits) {
        const container = document.getElementById("habitList");
        container.innerHTML = "";

        const active = habits.filter((h) => h.active == 1);
        const inactive = habits.filter((h) => h.active == 0);

        const createRow = (h, isActionActive) => `
          <div class="habit">
            <div>
              <div class="habit-name">${h.name}</div>
              <small style="color:#888">Added: ${
                h.created_at.split(" ")[0]
              }</small>
            </div>
            <div class="habit-actions">
              <button onclick="toggleHabit(${h.id}, ${h.active})" 
                      style="background: ${
                        isActionActive ? "#777" : "#4caf50"
                      }">
                ${isActionActive ? "Pause" : "Activate"}
              </button>
              <button class="danger" onclick="deleteHabit(${
                h.id
              })">Delete</button>
            </div>
          </div>
        `;

        if (active.length > 0) {
          const h2 = document.createElement("h2");
          h2.innerText = "Active Habits";
          container.appendChild(h2);
          active.forEach((h) => (container.innerHTML += createRow(h, true)));
        }

        if (inactive.length > 0) {
          const h2 = document.createElement("h2");
          h2.innerText = "Paused Habits";
          container.appendChild(h2);
          inactive.forEach((h) => (container.innerHTML += createRow(h, false)));
        }

        if (habits.length === 0) {
          container.innerHTML =
            "<p style='text-align:center; color:#888'>No habits found.</p>";
        }
      }

      // --- AI Analysis Logic ---
      async function analyzeHabits() {
        const user = getUser();
        if (!user) return;

        const resultsDiv = document.getElementById("results");
        const analyzeBtn = document.getElementById("analyzeBtn");

        // Simple Loading State
        analyzeBtn.disabled = true;
        analyzeBtn.innerText = "Analyzing...";

        resultsDiv.innerHTML = `
          <div class="loading">
            <p>Analyzing...</p>
          </div>
        `;

        try {
          const response = await fetch(
            `${API_BASE}/HabitAnalysisController.php?user_id=${user.id}`
          );

          const contentType = response.headers.get("content-type");
          if (!contentType || !contentType.includes("application/json")) {
            throw new Error("Server error: Response was not JSON.");
          }

          const jsonResponse = await response.json();

          if (
            response.ok &&
            jsonResponse.data &&
            jsonResponse.data.habit_analysis
          ) {
            renderAnalysisResults(jsonResponse.data.habit_analysis);
          } else {
            const msg = jsonResponse.data?.error || "Unknown error occurred.";
            resultsDiv.innerHTML = `<div class="error"><p>${msg}</p></div>`;
          }
        } catch (error) {
          console.error(error);
          resultsDiv.innerHTML = `
            <div class="error">
              <p><strong>Connection Failed</strong></p>
              <p>${error.message}</p>
            </div>
          `;
        } finally {
          analyzeBtn.disabled = false;
          analyzeBtn.innerText = "Analyze My Week";
        }
      }

      function renderAnalysisResults(data) {
        const resultsDiv = document.getElementById("results");
        let html = "";

        // 1. Summary
        if (data.summary) {
          html += `
            <div class="summary">
              <h3>Weekly Summary</h3>
              <p>${data.summary}</p>
            </div>
          `;
        }

        // 2. Habits Following Well
        if (data.following_well && data.following_well.length > 0) {
          html += `<div class="habits-section"><h3>Consistent Habits</h3>`;
          data.following_well.forEach((item) => {
            html += `
              <div class="habit-item">
                <span class="habit-title">${item.habit}</span>
                <span>${item.reason}</span>
              </div>
            `;
          });
          html += `</div>`;
        }

        // 3. Habits Not Following (Now with red styling)
        if (data.not_following && data.not_following.length > 0) {
          html += `<div class="habits-section needs-attention"><h3>Needs Attention</h3>`;
          data.not_following.forEach((item) => {
            html += `
              <div class="habit-item">
                <span class="habit-title">${item.habit}</span>
                <span>${item.reason}</span>
              </div>
            `;
          });
          html += `</div>`;
        }

        // 4. Tips
        if (data.tips && data.tips.length > 0) {
          html += `
            <div class="tips">
              <h3>Actionable Tips</h3>
              <ul>
                ${data.tips.map((tip) => `<li>${tip}</li>`).join("")}
              </ul>
            </div>
          `;
        }

        resultsDiv.innerHTML = html;
        resultsDiv.scrollIntoView({ behavior: "smooth" });
      }

      // --- Initialization ---
      document.getElementById("createForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const input = document.getElementById("nameInput");
        const name = input.value.trim();
        if (name) {
          createHabit(name);
          input.value = "";
        }
      });

      document
        .getElementById("analyzeBtn")
        .addEventListener("click", analyzeHabits);

      renderUser();
      loadHabits();
    </script>
  </body>
</html>
